[project]
name = "spindl-workshop"
version = "0.2.0"
description = "CyberCon2026 workshop: MCP response spooling with spindl, demonstrated against a simulated firewall"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "cognisn-spindl>=0.3.0",
    "pydantic>=2.0.0",
]

[project.scripts]
spindl-workshop = "spindl_workshop.server:main"
spindl-workshop-meter = "spindl_workshop.token_meter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spindl_workshop"]

[tool.hatch.build.targets.wheel.force-include]
"data/firewall.json" = "spindl_workshop/data/firewall.json"
